<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Branding Tool</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#1c1f26; --muted:#6b7280; --accent:#2563eb; --border:#e2e5ea; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, Segoe UI, Arial, sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:1100px; margin:0 auto; padding:16px; display:grid; grid-template-columns: 340px 1fr; gap:16px; }
  @media (max-width:820px){ .wrap{ grid-template-columns:1fr; } }
  .panel { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
  h1 { font-size:18px; margin:0 0 12px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:16px 0 8px; }
  label { display:block; font-size:13px; margin:8px 0 4px; }
  input[type=text], select { width:100%; padding:8px; border:1px solid var(--border); border-radius:8px; font:inherit; }
  input[type=file] { width:100%; font-size:13px; }
  input[type=range] { width:100%; }
  input[type=color] { width:44px; height:32px; padding:0; border:1px solid var(--border); border-radius:6px; background:none; }
  .row { display:flex; gap:10px; align-items:center; }
  .row > * { flex:1; }
  .row .fixed { flex:none; }
  button { width:100%; padding:12px; margin-top:16px; background:var(--accent); color:#fff; border:0; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .preview { display:flex; flex-direction:column; align-items:center; }
  canvas { width:100%; max-width:640px; aspect-ratio:1/1; border:1px solid var(--border); border-radius:8px;
    background: repeating-conic-gradient(#ddd 0% 25%, #fff 0% 50%) 0 0/20px 20px; }
  .hint { font-size:12px; color:var(--muted); margin-top:8px; }
  .seo-out { width:100%; margin-top:8px; }
  .seo-out h2 { display:flex; justify-content:space-between; align-items:center; }
  textarea { width:100%; height:120px; font:12px/1.4 Consolas, monospace; padding:8px; border:1px solid var(--border); border-radius:8px; resize:vertical; }
  button.copy { width:auto; margin:0; padding:4px 10px; font-size:12px; }
  #checks { list-style:none; padding:0; margin:0; font-size:13px; }
  #checks li { padding:3px 0; }
  .ok::before { content:"✅ "; } .warn::before { content:"⚠️ "; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1>Image Branding Tool</h1>

    <h2>Files</h2>
    <label>Main image</label>
    <input type="file" id="imgFile" accept="image/*,.svg,image/svg+xml">
    <label>Logo (PNG with transparency recommended)</label>
    <input type="file" id="logoFile" accept="image/*,.svg,image/svg+xml">

    <h2>Background</h2>
    <div class="row">
      <div>
        <label>Fit mode</label>
        <select id="fit">
          <option value="contain">Fit inside (show background)</option>
          <option value="cover">Fill (crop edges)</option>
        </select>
      </div>
      <div class="fixed">
        <label>Color</label>
        <input type="color" id="bgColor" value="#ffffff">
      </div>
    </div>
    <label><input type="checkbox" id="bgTransparent"> Transparent background (PNG/WebP only)</label>

    <h2>Logo (top-left)</h2>
    <label>Size: <span id="logoSizeV">18</span>%</label>
    <input type="range" id="logoSize" min="5" max="50" value="18">
    <label>Padding: <span id="logoPadV">32</span>px</label>
    <input type="range" id="logoPad" min="0" max="120" value="32">

    <h2>Footer</h2>
    <label>Footer text</label>
    <input type="text" id="footText" value="www.yourwebsite.com">
    <div class="row">
      <div><label>Text size: <span id="footSizeV">36</span>px</label>
        <input type="range" id="footSize" min="12" max="100" value="36"></div>
    </div>
    <div class="row">
      <div class="fixed"><label>Text</label><input type="color" id="footColor" value="#ffffff"></div>
      <div class="fixed"><label>Bar</label><input type="color" id="barColor" value="#111111"></div>
      <div><label>Bar opacity: <span id="barOpV">70</span>%</label>
        <input type="range" id="barOp" min="0" max="100" value="70"></div>
    </div>
    <label>Bar height: <span id="barHV">90</span>px</label>
    <input type="range" id="barH" min="40" max="240" value="90">
    <label>Font</label>
    <select id="font">
      <option>Arial</option><option>Georgia</option><option>Verdana</option>
      <option>Trebuchet MS</option><option>Times New Roman</option><option>Courier New</option>
    </select>

    <h2>Export (1024 × 1024)</h2>
    <div class="row">
      <div><label>Format</label>
        <select id="fmt">
          <option value="image/webp">WebP (smallest)</option>
          <option value="image/jpeg">JPG</option>
          <option value="image/png">PNG</option>
        </select></div>
      <div><label>Quality: <span id="qV">85</span>%</label>
        <input type="range" id="q" min="30" max="100" value="85"></div>
    </div>
    <label><input type="checkbox" id="autoOpt" checked> Auto-optimize file size (WebP/JPG)</label>
    <label>Target max size: <span id="maxKBV">150</span> KB</label>
    <input type="range" id="maxKB" min="30" max="500" step="10" value="150">

    <h2>SEO (Google Search Central)</h2>
    <label>Main keyword / product name</label>
    <input type="text" id="kw" placeholder="custom printed t-shirt">
    <label>Alt text (describe the image, ~125 chars max)</label>
    <input type="text" id="alt" placeholder="White custom printed t-shirt with colorful design">
    <label>Title (optional)</label>
    <input type="text" id="ttl">
    <label>Caption (optional, shown under image)</label>
    <input type="text" id="cap">
    <label>Images folder URL (where you will upload)</label>
    <input type="text" id="base" value="https://www.yourwebsite.com/images/">
    <label>Page URL where the image appears</label>
    <input type="text" id="page" value="https://www.yourwebsite.com/product/">
    <label>Creator / brand name</label>
    <input type="text" id="creator" placeholder="Your Brand">
    <label>License page URL (optional)</label>
    <input type="text" id="license">
    <label><input type="checkbox" id="lcp"> Main image at top of page (load first, no lazy-load)</label>

    <button id="dl" disabled>Download optimized image</button>
    <button id="dlAll" disabled style="background:#059669">Download all sizes (1024 / 768 / 512 / 320)</button>
  </div>

  <div class="panel preview">
    <canvas id="c" width="1024" height="1024"></canvas>
    <div class="hint" id="info">Upload an image to begin. Everything runs in your browser — nothing is uploaded.</div>

    <div class="seo-out">
      <h2>SEO checklist</h2>
      <ul id="checks"></ul>
      <h2>HTML snippet <button class="copy" data-t="outHtml">Copy</button></h2>
      <textarea id="outHtml" readonly></textarea>
      <h2>Structured data (JSON-LD) <button class="copy" data-t="outJson">Copy</button></h2>
      <textarea id="outJson" readonly></textarea>
      <h2>Image sitemap entry <button class="copy" data-t="outMap">Copy</button></h2>
      <textarea id="outMap" readonly></textarea>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const c = $('c'), ctx = c.getContext('2d');
const S = 1024;
let img = null, logo = null, imgName = 'image';

// Rasterize SVGs at high resolution so they stay sharp; AI-made SVGs often lack width/height.
async function svgToImage(file) {
  const doc = new DOMParser().parseFromString(await file.text(), 'image/svg+xml');
  const svg = doc.documentElement;
  if (svg.nodeName.toLowerCase() !== 'svg') throw new Error('Invalid SVG');
  let w = parseFloat(svg.getAttribute('width')), h = parseFloat(svg.getAttribute('height'));
  const vb = (svg.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
  if ((!w || !h) && vb.length === 4 && vb[2] && vb[3]) { w = vb[2]; h = vb[3]; }
  if (!w || !h) { w = 1024; h = 1024; }
  const k = 2048 / Math.max(w, h);            // render at up to 2048px on the long side
  svg.setAttribute('width', Math.round(w * k));
  svg.setAttribute('height', Math.round(h * k));
  if (!svg.getAttribute('viewBox')) svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  if (!svg.getAttribute('xmlns')) svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  return new Blob([new XMLSerializer().serializeToString(svg)], { type: 'image/svg+xml' });
}

async function load(file, cb) {
  try {
    const isSvg = file.type === 'image/svg+xml' || /\.svg$/i.test(file.name);
    const src = isSvg ? await svgToImage(file) : file;
    const im = new Image();
    im.onload = () => cb(im);
    im.onerror = () => alert('Could not read this file. Try another image or SVG.');
    im.src = URL.createObjectURL(src);
  } catch (err) {
    alert('Could not read this file: ' + err.message);
  }
}
$('imgFile').onchange = e => { const f = e.target.files[0]; if (!f) return;
  imgName = f.name.replace(/\.[^.]+$/, ''); load(f, im => { img = im; $('dl').disabled = false; $('dlAll').disabled = false; if (!$('kw').value) $('kw').placeholder = imgName; draw(); updateSeo(); }); };
$('logoFile').onchange = e => { const f = e.target.files[0]; if (!f) return; load(f, im => { logo = im; draw(); updateSeo(); }); };

function hexRgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}

function draw() {
  ctx.clearRect(0, 0, S, S);
  const transparent = $('bgTransparent').checked;
  if (!transparent) { ctx.fillStyle = $('bgColor').value; ctx.fillRect(0, 0, S, S); }

  if (img) {
    const k = $('fit').value === 'cover' ? Math.max(S / img.width, S / img.height) : Math.min(S / img.width, S / img.height);
    const w = img.width * k, h = img.height * k;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
  }

  // Footer bar + text
  const text = $('footText').value.trim();
  if (text) {
    const barH = +$('barH').value;
    ctx.fillStyle = hexRgba($('barColor').value, $('barOp').value / 100);
    ctx.fillRect(0, S - barH, S, barH);
    ctx.fillStyle = $('footColor').value;
    ctx.font = `600 ${$('footSize').value}px "${$('font').value}", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, S / 2, S - barH / 2, S - 40);
  }

  // Logo top-left
  if (logo) {
    const w = S * $('logoSize').value / 100, h = w * logo.height / logo.width, p = +$('logoPad').value;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(logo, p, p, w, h);
  }

  ['logoSize','logoPad','footSize','barOp','barH','q'].forEach(id => {
    const el = $(id + 'V'); if (el) el.textContent = $(id).value; });
  $('logoSizeV').textContent = $('logoSize').value;
  $('logoPadV').textContent = $('logoPad').value;
  $('footSizeV').textContent = $('footSize').value;
  $('barOpV').textContent = $('barOp').value;
  $('barHV').textContent = $('barH').value;
  $('qV').textContent = $('q').value;
}
document.querySelectorAll('input, select').forEach(el => {
  if (el.type !== 'file') el.addEventListener('input', draw);
});

// ---------- Export & optimization ----------
const SIZES = [1024, 768, 512, 320];
const EXT = { 'image/webp': 'webp', 'image/jpeg': 'jpg', 'image/png': 'png' };
const toBlob = (cv, type, q) => new Promise(r => cv.toBlob(r, type, q));

function slug() {
  const s = ($('kw').value || imgName).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  return s || 'image';
}
const fileName = size => `${slug()}-${size}w.${EXT[$('fmt').value]}`;

function canvasAt(size) {
  if (size === S) return c;
  const t = document.createElement('canvas'); t.width = t.height = size;
  const x = t.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(c, 0, 0, size, size);
  return t;
}

async function blobAt(size) {
  let type = $('fmt').value;
  if (type === 'image/jpeg' && $('bgTransparent').checked) { $('bgTransparent').checked = false; draw(); }
  const cv = canvasAt(size);
  let q = $('q').value / 100;
  let b = await toBlob(cv, type, q);
  if ($('autoOpt').checked && type !== 'image/png') {
    const max = $('maxKB').value * 1024 * (size / S > 0.6 ? 1 : 0.6);
    while (b.size > max && q > 0.4) { q -= 0.05; b = await toBlob(cv, type, q); }
  }
  return b;
}

function save(b, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

$('dl').onclick = async () => {
  const b = await blobAt(S);
  save(b, fileName(S));
  $('info').textContent = `Downloaded ${fileName(S)} (${(b.size / 1024).toFixed(0)} KB)`;
};
$('dlAll').onclick = async () => {
  for (const s of SIZES) { save(await blobAt(s), fileName(s)); await new Promise(r => setTimeout(r, 400)); }
  $('info').textContent = `Downloaded ${SIZES.length} sizes. Upload them all to the images folder.`;
};

// ---------- SEO output ----------
const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const withSlash = u => u && !u.endsWith('/') ? u + '/' : u;
let sizeTimer, lastKB = null;

function updateSeo(skipEstimate) {
  const base = withSlash($('base').value.trim()), alt = $('alt').value.trim(), ttl = $('ttl').value.trim(),
        cap = $('cap').value.trim(), page = $('page').value.trim(), creator = $('creator').value.trim(),
        lic = $('license').value.trim(), lcp = $('lcp').checked, mime = $('fmt').value;
  const url = s => base + fileName(s);
  const srcset = SIZES.map(s => `${url(s)} ${s}w`).join(',\n         ');
  const attrs = [
    `src="${esc(url(S))}"`, `srcset="${esc(srcset)}"`, `sizes="(max-width: 1024px) 100vw, 1024px"`,
    `width="1024"`, `height="1024"`, `alt="${esc(alt)}"`, ttl ? `title="${esc(ttl)}"` : '',
    lcp ? `fetchpriority="high"` : `loading="lazy"`, `decoding="async"`
  ].filter(Boolean).join('\n     ');
  const imgTag = `<img ${attrs}>`;
  $('outHtml').value = cap ? `<figure>\n  ${imgTag}\n  <figcaption>${esc(cap)}</figcaption>\n</figure>` : imgTag;

  const ld = { '@context': 'https://schema.org', '@type': 'ImageObject', contentUrl: url(S),
    encodingFormat: mime, width: '1024', height: '1024' };
  if (alt) ld.description = alt; if (ttl) ld.name = ttl; if (cap) ld.caption = cap;
  if (creator) { ld.creator = { '@type': 'Organization', name: creator }; ld.creditText = creator; ld.copyrightNotice = '© ' + new Date().getFullYear() + ' ' + creator; }
  if (lic) { ld.license = lic; ld.acquireLicensePage = lic; }
  $('outJson').value = `<script type="application/ld+json">\n${JSON.stringify(ld, null, 2)}\n<\/script>`;

  $('outMap').value = `<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"\n        xmlns:image="http://www.google.com/schemas/sitemap-image/1.1">\n  <url>\n    <loc>${esc(page)}</loc>\n    <image:image>\n      <image:loc>${esc(url(S))}</image:loc>\n    </image:image>\n  </url>\n</urlset>`;

  const checks = [
    [!!$('kw').value.trim(), 'Descriptive, keyword-based file name (' + fileName(S) + ')'],
    [alt.length >= 10 && alt.length <= 125, `Alt text is meaningful and ≤125 characters (${alt.length})`],
    [!/^(image|photo|picture)\b/i.test(alt) || !alt, 'Alt text does not start with "image of / photo of"'],
    [/^https:\/\//.test(base), 'Image URL uses HTTPS'],
    [mime !== 'image/png', 'Modern compressed format (WebP/JPG) rather than PNG'],
    [lastKB !== null && lastKB <= 200, lastKB === null ? 'File size: upload an image to check' : `File size ${lastKB} KB (aim for under 200 KB)`],
    [true, 'width & height set in HTML (prevents layout shift / CLS)'],
    [true, 'Responsive srcset + sizes included'],
    [true, lcp ? 'Above-the-fold image: fetchpriority="high", no lazy-load' : 'loading="lazy" set (uncheck top-of-page option only for the main hero image)'],
    [!!creator, 'Creator / copyright info included in structured data']
  ];
  $('checks').innerHTML = checks.map(([ok, t]) => `<li class="${ok ? 'ok' : 'warn'}">${esc(t)}</li>`).join('');

  if (!skipEstimate) {
    clearTimeout(sizeTimer);
    sizeTimer = setTimeout(async () => {
      if (!img) return;
      lastKB = Math.round((await blobAt(S)).size / 1024);
      updateSeo(true);
    }, 500);
  }
}

document.querySelectorAll('.copy').forEach(b => b.onclick = () => {
  const t = $(b.dataset.t); t.select(); navigator.clipboard.writeText(t.value); b.textContent = 'Copied!';
  setTimeout(() => b.textContent = 'Copy', 1200);
});
document.querySelectorAll('input, select').forEach(el => { if (el.type !== 'file') el.addEventListener('input', () => updateSeo()); });
$('maxKB').addEventListener('input', () => $('maxKBV').textContent = $('maxKB').value);
draw(); updateSeo();
</script>
</body>
</html>
