<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4e6"/>
      <stop offset="1" stop-color="#ffe0f0"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9edf3"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3d81"/>
      <stop offset="0.5" stop-color="#ff9f1c"/>
      <stop offset="1" stop-color="#2ec4b6"/>
    </linearGradient>
    <linearGradient id="art2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5b2eff"/>
      <stop offset="1" stop-color="#00c2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#5b2e4f" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="880" cy="140" r="150" fill="#ffd166" opacity="0.45"/>
  <circle cx="120" cy="860" r="170" fill="#8ecae6" opacity="0.4"/>
  <circle cx="930" cy="760" r="90" fill="#ff8fab" opacity="0.4"/>

  <!-- Confetti / creative shapes -->
  <g opacity="0.9">
    <path d="M820 300 l14 28 30 4 -22 21 6 30 -28 -15 -27 15 5 -30 -22 -21 31 -4z" fill="#ff3d81"/>
    <rect x="180" y="470" width="26" height="26" rx="5" fill="#5b2eff" transform="rotate(20 193 483)"/>
    <circle cx="150" cy="650" r="14" fill="#2ec4b6"/>
    <circle cx="890" cy="560" r="12" fill="#5b2eff"/>
    <path d="M905 430 q14 -22 28 0 t28 0" fill="none" stroke="#ff9f1c" stroke-width="8" stroke-linecap="round"/>
    <path d="M110 330 q14 -22 28 0 t28 0" fill="none" stroke="#2ec4b6" stroke-width="8" stroke-linecap="round"/>
    <path d="M95 560 l20 0 M105 550 l0 20" stroke="#ff3d81" stroke-width="7" stroke-linecap="round"/>
    <path d="M930 660 l20 0 M940 650 l0 20" stroke="#5b2eff" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- T-shirt -->
  <g transform="translate(0,30)" filter="url(#shadow)">
    <path d="M410 170 Q512 265 614 170 L740 205 L872 372 L792 440 L745 392 L745 810 L279 810 L279 392 L232 440 L152 372 L284 205 Z"
          fill="url(#shirt)" stroke="#cfd6e0" stroke-width="4" stroke-linejoin="round"/>
    <!-- collar -->
    <path d="M410 170 Q512 265 614 170" fill="none" stroke="#c5ccd8" stroke-width="18" stroke-linecap="round"/>
    <path d="M422 176 Q512 250 602 176" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <!-- sleeve seams -->
    <path d="M279 392 L284 205" stroke="#d5dbe5" stroke-width="3" fill="none"/>
    <path d="M745 392 L740 205" stroke="#d5dbe5" stroke-width="3" fill="none"/>
    <!-- folds -->
    <path d="M330 640 Q380 700 350 800" stroke="#dde3ec" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M690 620 Q650 700 675 800" stroke="#dde3ec" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- hem -->
    <path d="M279 790 L745 790" stroke="#d5dbe5" stroke-width="3" stroke-dasharray="10 8"/>
  </g>

  <!-- Chest print artwork -->
  <g transform="translate(512,500)">
    <!-- burst -->
    <g fill="url(#art)">
      <path d="M0 -140 L18 -100 L60 -122 L52 -78 L100 -72 L70 -38 L118 -10 L72 10 L100 52 L54 48 L52 100 L20 68 L0 118 L-20 68 L-52 100 L-54 48 L-100 52 L-72 10 L-118 -10 L-70 -38 L-100 -72 L-52 -78 L-60 -122 L-18 -100 Z"/>
    </g>
    <circle r="78" fill="#ffffff"/>
    <circle r="70" fill="url(#art2)"/>
    <!-- print head / brush icon -->
    <path d="M-28 -34 h56 v26 h-14 v14 h-28 v-14 h-14z" fill="#ffffff"/>
    <rect x="-8" y="6" width="16" height="36" rx="6" fill="#ffd166"/>
    <!-- drops -->
    <path d="M-40 52 q-8 12 0 18 q8 -6 0 -18z" fill="#ff3d81"/>
    <path d="M36 50 q-8 12 0 18 q8 -6 0 -18z" fill="#2ec4b6"/>
    <!-- text -->
    <text x="0" y="176" text-anchor="middle" font-family="Arial Black, Impact, Arial, sans-serif" font-size="46" font-weight="900" fill="#1c1f26" letter-spacing="2">YOUR IDEA.</text>
    <text x="0" y="222" text-anchor="middle" font-family="Arial Black, Impact, Arial, sans-serif" font-size="46" font-weight="900" fill="#ff3d81" letter-spacing="2">YOUR STYLE.</text>
  </g>

  <!-- Callout badge -->
  <g transform="translate(830,880) rotate(-10)">
    <rect x="-118" y="-34" width="236" height="68" rx="34" fill="#1c1f26"/>
    <text x="0" y="9" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">CUSTOM PRINT</text>
  </g>
</svg>
